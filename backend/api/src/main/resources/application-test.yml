# Profile test: datasource do PostgreSQL nhúng (Zonky) cung cấp — xem AbstractIntegrationTest.
spring:
  main:
    banner-mode: off

management:
  health:
    # Redis chưa được dùng trong test tích hợp; tránh health DOWN khi máy không chạy Redis.
    redis:
      enabled: false

app:
  security:
    jwt:
      # Khóa chỉ dùng cho test
      secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLW1vdmllLWJvb2tpbmctMjAyNg==
    refresh-cookie-secure: false
  ticket:
    secret: test-ticket-secret
  payment:
    mock:
      secret: test-mock-payment-secret
  # Test gọi đăng nhập/giữ ghế rất nhiều lần từ cùng IP
  rate-limit:
    login-per-minute: 100000
    hold-per-minute: 100000
  booking:
    # Test gọi HoldService.expire trực tiếp với đồng hồ giả, không chạy job nền
    expiry-job-enabled: false
  group:
    deadline-job-enabled: false

logging:
  level:
    com.moviebooking: INFO
