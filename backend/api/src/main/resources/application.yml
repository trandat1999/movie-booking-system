spring:
  application:
    name: movie-booking-api
  profiles:
    default: dev
  autoconfigure:
    # Không dùng user mặc định của Spring Security — xác thực bằng JWT (security/JwtAuthenticationFilter).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Nạp các collection lazy theo lô, tránh N+1 khi phân trang
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  security:
    jwt:
      # Bắt buộc đặt biến môi trường JWT_SECRET (Base64, >= 256 bit) ngoài môi trường dev/test
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-token-reuse-grace: 30s
    refresh-cookie-name: mb_refresh
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
